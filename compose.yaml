services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uadb
      POSTGRES_PASSWORD: uadb
      POSTGRES_DB: uadb
    ports:
      - "5433:5432"
    volumes:
      - postgres16_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uadb -d uadb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres16_data:
